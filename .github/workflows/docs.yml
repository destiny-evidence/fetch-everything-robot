name: Documentation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: "3.x"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8
        with:
          # Install a specific version of uv.
          version: "0.8.4"

      - name: Install the project
        run: uv sync --locked --extra docs

      - name: Build documentation
        run: uv run mkdocs build --strict

      # Automatically deploy documentation to a GitHub Pages website on pushing to main.
      # Requires configuring the repository to deploy GitHub pages from a branch
      # gh-pages (https://tinyurl.com/gh-pages-from-branch), which will be created the
      # first time this workflow step is run.
      - name: Publish documentation on GitHub pages
        if: success() && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4
        with:
          github_token: ${{  secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
