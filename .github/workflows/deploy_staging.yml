name: Manual staging deployment of fetch-everything-robot to Azure Container Apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy-staging:
    runs-on: ubuntu-latest
    environment: staging

    env:
      IMAGE_NAME: fetch-everything-robot

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build and push Docker image
        id: buildpush
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REPOSITORY_LOGIN_SERVER }}
          username: ${{ secrets.DEPLOYMENT_CLIENT_ID }}
          password: ${{ secrets.DEPLOYMENT_CLIENT_SECRET }}
        env:
          DOCKER_BUILDKIT: 1
      - run: |
          export TAG=$(git rev-parse --short HEAD)
          docker build -t ${{ secrets.REPOSITORY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${TAG} .
          docker push ${{ secrets.REPOSITORY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${TAG}
      - name: Deploy to Azure Container App
        run: |
          export TAG=$(git rev-parse --short HEAD)
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME_STAGING }} \
            --resource-group ${{ secrets.RESOURCE_GROUP_STAGING }} \
            --image ${{ secrets.REPOSITORY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${TAG}
